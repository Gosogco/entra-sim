[package]
name = "entra-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rcgen = { version = "0.14.10", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
