[package]
name = "entra-sim"
version = "0.4.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rcgen = { version = "0.14.10", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rsa = { version = "0.9.10", features = ["getrandom"] }
base64 = "0.23.1"
sha2 = "0.10"
uuid = { version = "1.27.0", features = ["v4"] }
rand = "0.8"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "parsing", "macros"] }

[dev-dependencies]
base64 = "0.23.1"
jsonwebtoken = "11.1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
