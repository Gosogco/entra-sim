name: Release

on:
  push:
    tags: ['v*']

# Only what publishing needs: the image goes to this repository's package registry, and the
# release notes are attached to the repository itself.
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # A tag is not a reason to skip the checks. Publishing an image that fails its own tests
      # is worse than a delayed release.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

      # The crate version and the tag must agree, or `docker run image:v1.2.3 --version` would
      # report something other than the tag it was pulled by.
      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  publish:
    name: Publish the image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arm64 is emulated, which is slow but avoids needing a second runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The built-in token, so no secret has to be created or rotated.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # A caller can pin exactly, float within a minor, float within a major, or take the
          # newest. `latest` moves only for a non-prerelease tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=entra-sim
            org.opencontainers.image.description=A simulator of the Microsoft Entra ID identity endpoints and the Microsoft Graph API

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
        run: |
          # Written to a file rather than passed inline: the notes contain backticks and blank
          # lines, and an indented heredoc would carry its indentation into the markdown.
          {
            printf '```\n'
            printf 'docker pull %s\n' "$IMAGE_REF"
            printf '```\n\n'
            printf 'Published for `linux/amd64` and `linux/arm64`.\n\n'
            printf '## Pointing a client at it\n\n'
            printf '```sh\n'
            printf 'docker run --rm -p 8080:8080 -p 8443:8443 \\\n'
            printf '  -v "$PWD/certs:/certs" %s\n' "$IMAGE_REF"
            printf '```\n\n'
            printf 'For Terraform, set `metadata_host` (or `ARM_METADATA_HOSTNAME`) to the\n'
            printf "simulator's host and port, and \`SSL_CERT_FILE\` to the CA it writes to\n"
            printf '`/certs/ca.pem`.\n'
          } > notes.md

          # A tag carrying a prerelease identifier is published as one, so `latest` and the
          # release listing both stay on stable versions.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease
