name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer, larger compilation units; faster than the default for a CI run that builds once.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # Warnings are errors here so that a lint cannot accumulate unnoticed.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  generated-files:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Graph permission catalogue, the directory role templates and the per-endpoint
      # requirement table are all generated from Microsoft's published documentation. Checking
      # them here catches a hand-edit, and reports upstream changes as a diff rather than as a
      # silent drift between the simulator and the real service.
      - name: Fetch the Microsoft Graph documentation
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/microsoftgraph/microsoft-graph-docs-contrib /tmp/graph-docs
          git -C /tmp/graph-docs sparse-checkout set --no-cone \
            '/concepts/permissions-reference.md' \
            '/api-reference/v1.0/includes/permissions/*' \
            '/api-reference/v1.0/api/*'

      - name: Fetch the Microsoft Entra documentation
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/MicrosoftDocs/entra-docs /tmp/entra-docs
          git -C /tmp/entra-docs sparse-checkout set --no-cone \
            '/docs/identity/role-based-access-control/permissions-reference.md'

      - name: Regenerate
        run: |
          scripts/generate-graph-permissions.py \
            /tmp/graph-docs/concepts/permissions-reference.md \
            src/graph/graph_permissions.json
          scripts/generate-directory-roles.py \
            /tmp/entra-docs/docs/identity/role-based-access-control/permissions-reference.md \
            src/graph/directory_roles.json
          scripts/generate-permission-requirements.py \
            /tmp/graph-docs/api-reference/v1.0 \
            src/auth/permission_requirements.json

      - name: Report any drift
        run: |
          if ! git diff --quiet; then
            echo "::warning::A generated file differs from the published documentation."
            echo "Regenerate with scripts/generate-*.py and commit the result."
            git --no-pager diff --stat
          fi

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: entra-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough: the point of the image is that it answers requests, and a
      # misconfigured entrypoint or a missing runtime dependency only shows up when it runs.
      - name: Check the image serves requests
        run: |
          mkdir -p certs && chmod 777 certs
          docker run --detach --name entra-sim \
            --publish 8080:8080 --publish 8443:8443 \
            --volume "$PWD/certs:/certs" \
            entra-sim:ci

          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/__sim__/health; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/__sim__/health
          curl --fail --silent --cacert certs/ca.pem \
            https://localhost:8443/metadata/endpoints?api-version=2022-09-01 > /dev/null

          token=$(curl --fail --silent --cacert certs/ca.pem \
            --data grant_type=client_credentials \
            --data client_id=11111111-1111-1111-1111-111111111111 \
            --data client_secret=entra-sim-bootstrap-secret \
            --data 'scope=https://localhost:8443/.default' \
            https://localhost:8443/00000000-0000-0000-0000-000000000001/oauth2/v2.0/token \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          curl --fail --silent --cacert certs/ca.pem \
            --header "Authorization: Bearer $token" \
            https://localhost:8443/v1.0/domains > /dev/null

      - name: Show the container log on failure
        if: failure()
        run: docker logs entra-sim

  contract:
    name: Provider contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: contract/envcheck/go.mod
          cache-dependency-path: contract/envcheck/go.sum

      - name: Build the contract checker
        run: go build -o envcheck .
        working-directory: contract/envcheck

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build the simulator
        run: cargo build --release --locked

      # This runs the azuread provider's own discovery and client-credentials code against the
      # simulator, at the SDK version the provider pins. A change in the SDK that breaks the
      # simulator surfaces here rather than as a confusing provider error.
      - name: Check the provider contract
        run: |
          mkdir -p certs
          ./target/release/entra-sim \
            --bind 127.0.0.1 --http-port 8080 --https-port 8443 \
            --tls-san localhost,127.0.0.1 --public-host localhost:8443 \
            --ca-out certs/ca.pem &

          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/__sim__/health; then
              break
            fi
            sleep 1
          done

          SSL_CERT_FILE="$PWD/certs/ca.pem" contract/envcheck/envcheck \
            https://localhost:8443 \
            00000000-0000-0000-0000-000000000001 \
            11111111-1111-1111-1111-111111111111 \
            entra-sim-bootstrap-secret

  terraform:
    name: Terraform acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build the simulator
        run: cargo build --release --locked

      - name: Start the simulator
        run: |
          mkdir -p certs
          ./target/release/entra-sim \
            --bind 127.0.0.1 --http-port 8080 --https-port 8443 \
            --tls-san localhost,127.0.0.1 --public-host localhost:8443 \
            --ca-out certs/ca.pem > simulator.log 2>&1 &

          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/__sim__/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/__sim__/health

      # The real azuread provider against the simulator, configured only by environment: the
      # same configuration would run against a real tenant with ARM_METADATA_HOSTNAME removed.
      - name: Apply, verify the plan is empty, then destroy
        working-directory: terraform/accept
        env:
          ARM_METADATA_HOSTNAME: localhost:8443
          ARM_TENANT_ID: 00000000-0000-0000-0000-000000000001
          ARM_CLIENT_ID: 11111111-1111-1111-1111-111111111111
          ARM_CLIENT_SECRET: entra-sim-bootstrap-secret
        run: |
          export SSL_CERT_FILE="$GITHUB_WORKSPACE/certs/ca.pem"

          terraform init -input=false
          terraform apply -auto-approve -input=false

          # The decisive check. A non-empty plan right after apply means the simulator is not
          # echoing back something the provider wrote, which is the most likely class of bug
          # here and the one least visible from unit tests.
          terraform plan -detailed-exitcode -input=false

          terraform destroy -auto-approve -input=false

      - name: Show the simulator log on failure
        if: failure()
        run: cat simulator.log

  browser:
    name: Browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/react-spa/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build the simulator
        run: cargo build --release --locked

      - name: Start the simulator
        run: |
          mkdir -p certs
          # example.test, because the user the example signs in as is alice@example.test.
          ./target/release/entra-sim \
            --bind 127.0.0.1 --http-port 8080 --https-port 8443 \
            --tls-san localhost,127.0.0.1 --public-host localhost:8443 \
            --tenant-domain example.test --ca-out certs/ca.pem > simulator.log 2>&1 &

          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/__sim__/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/__sim__/health

      # The same configuration that would run against a real tenant, with
      # ARM_METADATA_HOSTNAME pointing it at the simulator instead.
      - name: Create the app registration and the user
        working-directory: examples/react-spa/terraform
        env:
          ARM_METADATA_HOSTNAME: localhost:8443
          ARM_TENANT_ID: 00000000-0000-0000-0000-000000000001
          ARM_CLIENT_ID: 11111111-1111-1111-1111-111111111111
          ARM_CLIENT_SECRET: entra-sim-bootstrap-secret
          TF_VAR_simulator_host: localhost:8443
        run: |
          export SSL_CERT_FILE="$GITHUB_WORKSPACE/certs/ca.pem"
          terraform init -input=false
          terraform apply -auto-approve -input=false
          # A non-empty plan here would mean the simulator is not echoing back something the
          # provider wrote, the same gate the other Terraform job applies.
          terraform plan -detailed-exitcode -input=false
          terraform output -raw env > ../.env

      - name: Install the example
        working-directory: examples/react-spa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check and build
        working-directory: examples/react-spa
        run: npm run build

      # Drives a real browser through the whole flow: MSAL sign-in, the Graph call, and a
      # permission change taking effect. It also asserts MSAL never reaches a Microsoft host,
      # without which a passing sign-in could mean it had used the real service.
      - name: Run the browser test
        working-directory: examples/react-spa
        run: npm run e2e

      - name: Show the logs on failure
        if: failure()
        run: |
          cat simulator.log
          cat examples/react-spa/.env | sed 's/^/env: /'
